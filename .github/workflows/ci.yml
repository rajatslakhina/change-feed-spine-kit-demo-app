name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: macOS 15 · resolve remote package + build for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        run: xcodebuild -version
      - name: Resolve the remote Swift package from GitHub
        run: xcodebuild -resolvePackageDependencies -project Demo.xcodeproj -scheme Demo
      - name: Show resolved version
        run: cat Demo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || true
      - name: Build the app for the iOS Simulator (compile-only, no device needed)
        run: xcodebuild build -project Demo.xcodeproj -scheme Demo -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
